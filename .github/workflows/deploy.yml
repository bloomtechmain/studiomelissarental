name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/app
            # npm ci can still rewrite platform-specific optional-dependency
            # fields in package-lock.json when the server's npm version
            # differs from whatever generated the committed lockfile (seen
            # twice now) -- discard that drift unconditionally before
            # pulling so it never blocks the next deploy.
            git checkout -- package-lock.json
            git pull origin main
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart studio-melissa
